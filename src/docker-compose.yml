services:
  battleship:
    build:
      context: ./GpBattleshipWebapp
      dockerfile: Dockerfile
    image: gp-battleship:latest
    container_name: gp-battleship
    restart: unless-stopped
    ports:
      # Expose locally; the Cloudflare Tunnel points at http://localhost:8080
      - "8080:8080"
    environment:
      # Public HTTPS URL of your site (the Cloudflare hostname). Used to build
      # the QR join link so phones hit the tunnel, not localhost.
      PUBLIC_BASE_URL: "https://battleship.example.com"
      ASPNETCORE_ENVIRONMENT: "Production"
